name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  directus-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directus: ['11.17.4', '12.5.1']
    services:
      directus:
        image: directus/directus:${{ matrix.directus }}
        ports:
          - 8055:8055
        env:
          SECRET: dsk-ci-secret-at-least-32-characters
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: dsk-ci-password
          DB_CLIENT: sqlite3
          DB_FILENAME: /directus/database/data.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for Directus
        run: |
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8055/server/ping && exit 0
            sleep 2
          done
          exit 1
      - run: pnpm test:integration
        env:
          DSK_INTEGRATION_VERSION: ${{ matrix.directus }}
          DSK_INTEGRATION_URL: http://127.0.0.1:8055
          DSK_INTEGRATION_EMAIL: admin@example.com
          DSK_INTEGRATION_PASSWORD: dsk-ci-password

  sqlite-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            playground/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir playground install --frozen-lockfile
      - name: SQLite indexes and fresh Directus apply after restart
        run: node --import tsx --test test/integration/sqlite-indexes.integration.test.ts
        env:
          DSK_SQLITE_PROJECT: playground
      - name: Isolated development cleanup lifecycle
        run: node --import tsx --test test/integration/cleanup.integration.test.ts
        env:
          DSK_CLEANUP_PROJECT: playground
      - name: Isolated translations and field conditions lifecycle
        run: node --import tsx --test test/integration/metadata.integration.test.ts
        env:
          DSK_METADATA_PROJECT: playground
